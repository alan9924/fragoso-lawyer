<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Evaluación Estratégica | Ferro Fragoso</title>
    <link rel="canonical" href="https://ferrofragoso.com/evaluacion.html">
    <!-- Open Graph / redes: sin esto, al compartir el link en WhatsApp o LinkedIn
         aparece solo la URL, sin imagen ni descripción. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ferrofragoso.com/evaluacion.html">
    <meta property="og:title" content="Evaluación Estratégica | Ferro Fragoso">
    <meta property="og:description" content="Inicia tu evaluación legal estratégica con Ferro Fragoso Estudio Jurídico.">
    <meta property="og:image" content="https://ferrofragoso.com/signature_on_dark.png">
    <meta property="og:site_name" content="Ferro Fragoso, Estudio Jurídico">
    <meta property="og:locale" content="es_MX">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Evaluación Estratégica | Ferro Fragoso">
    <meta name="twitter:description" content="Inicia tu evaluación legal estratégica con Ferro Fragoso Estudio Jurídico.">
    <meta name="twitter:image" content="https://ferrofragoso.com/signature_on_dark.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="description" content="Inicia tu evaluación legal estratégica con Ferro Fragoso Estudio Jurídico.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@200;300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ── TOKENS ── */
        :root {
            --ivory:      #fdfcf9;
            --stone-100:  #f2ede4;
            --stone-200:  #e8e1d5;
            --stone-300:  #d5ccbf;
            --warm-gray:  #b0a99e;
            --taupe:      #8c837a;
            --carbon:     #2e2c2a;
            --carbon-deep:#1a1917;
            --bronze:     #9e8e70;
            --success:    #4a7c59;

            --font-h: 'Cormorant Garamond', Georgia, serif;
            --font-b: 'Montserrat', system-ui, sans-serif;
            --ease:   cubic-bezier(0.25, 1, 0.5, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--ivory);
            color: var(--carbon);
            font-family: var(--font-b);
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 3rem;
            border-bottom: 1px solid var(--stone-200);
            background: var(--ivory);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-brand {
            font-family: var(--font-h);
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--carbon);
            text-decoration: none;
        }

        .back-link {
            font-family: var(--font-b);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--taupe);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }

        .back-link:hover { color: var(--carbon); }
        .back-link svg { width: 14px; height: 14px; }

        /* ── MAIN CONTAINER ── */
        .eval-main {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 3rem 2rem 5rem;
        }

        .eval-card {
            width: 100%;
            max-width: 660px;
        }

        /* ── Confirmación (pantalla final del cuestionario) ── */
        .eval-ok {
            width: 56px;
            height: 56px;
            margin: 0 0 1.2rem;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--ffq-acento-suave);
            color: var(--ffq-acento);
        }
        .eval-ok svg { width: 24px; height: 24px; }
        .eval-protocolo { list-style: none; display: grid; gap: 1rem; margin: 0; padding: 0; }
        .eval-protocolo li { display: grid; grid-template-columns: 1.8rem 1fr; gap: .6rem; align-items: start; }
        .eval-protocolo .eval-num { font-family: var(--ffq-serif); font-style: italic; font-size: 1.2rem; line-height: 1.2; color: var(--ffq-acento); }
        .eval-protocolo h4 { margin: 0 0 .25rem; font-size: .84rem; font-weight: 600; color: var(--ffq-tinta); }
        .eval-protocolo p { margin: 0; font-size: .82rem; line-height: 1.55; color: var(--ffq-suave); }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .topbar { padding: 1.25rem 1.5rem; }
            .eval-main { padding: 2.5rem 1.5rem 4rem; }
        }
        @media (max-width: 560px) {
            .eval-main { padding: 0; }
        }

        /* ── Objetivos táctiles en móvil ──────────────────────────────────
           Esta página tiene su CSS embebido y no carga styles.css, así que
           las reglas globales de accesibilidad no la alcanzaban. */
        @media (max-width: 768px) {
            .back-home,
            a[href="index.html"] {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
            }
        }
    </style>
    <link rel="stylesheet" href="cuestionario.css?v=2">
</head>
<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <a href="index.html" class="topbar-brand">FERRO FRAGOSO</a>
        <a href="index.html" class="back-link">
            <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="13" y1="7" x2="1" y2="7" stroke="currentColor" stroke-width="0.8"/>
                <polyline points="5,3 1,7 5,11" stroke="currentColor" stroke-width="0.8" fill="none"/>
            </svg>
            VOLVER AL INICIO
        </a>
    </header>

    <!-- MAIN -->
    <main class="eval-main">
        <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">Evaluación estratégica</h1>
        <div class="eval-card" id="evaluacion"></div>
    </main>

    <template id="eval-confirmacion">
        <div>
            <div class="eval-ok" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="ffq-bloque">
                <h3>Confirmación de Recepción Estratégica</h3>
                <ol class="eval-protocolo">
                    <li>
                        <span class="eval-num">I</span>
                        <div>
                            <h4>Análisis de Viabilidad (24 horas)</h4>
                            <p>Los socios fundadores analizarán la información proporcionada para verificar que no existan conflictos de interés y evaluar la viabilidad de su planteamiento.</p>
                        </div>
                    </li>
                    <li>
                        <span class="eval-num">II</span>
                        <div>
                            <h4>Contacto Directo</h4>
                            <p>Uno de nuestros socios fundadores se comunicará personalmente con usted vía telefónica o WhatsApp para agendar la sesión inicial.</p>
                        </div>
                    </li>
                    <li>
                        <span class="eval-num">III</span>
                        <div>
                            <h4>Sesión de Diagnóstico</h4>
                            <p>Diseñaremos juntos el mapa de ruta jurídica inicial en nuestras oficinas o vía videoconferencia cifrada.</p>
                        </div>
                    </li>
                </ol>
            </div>
        </div>
    </template>

    <script src="cuestionario.js?v=2"></script>
    <script>
    (function () {
        FFCuestionario.abrir({
            contenedor: document.getElementById('evaluacion'),
            pasos: [
                {
                    tipo: 'campos',
                    titulo: '¿Quién nos consulta?',
                    texto: 'Sus datos nos permiten contactarle personalmente. Todo es estrictamente confidencial.',
                    campos: [
                        { clave: 'nombre', etiqueta: 'Nombre completo o razón social', placeholder: 'Ej. Juan Pérez / Empresa S.A. de C.V.', autocomplete: 'name' },
                        {
                            clave: 'telefono', etiqueta: 'Teléfono / WhatsApp', tipo: 'tel', inputmode: 'tel', placeholder: '10 dígitos', autocomplete: 'tel',
                            validar: (v) => (v.trim().length < 10 ? 'Ingrese un número de 10 dígitos.' : null),
                        },
                        { clave: 'correo', etiqueta: 'Correo electrónico', tipo: 'email', placeholder: 'correo@dominio.com', autocomplete: 'email', opcional: true },
                    ],
                },
                {
                    clave: 'materia',
                    tipo: 'opciones',
                    lista: true,
                    titulo: '¿Cuál es su área de interés?',
                    texto: 'Seleccione la rama del derecho que mejor describe su situación.',
                    opciones: [
                        { valor: 'Corporativo', etiqueta: 'Corporativo / Empresarial', detalle: 'Contratos, sociedades, fusiones, protección de activos' },
                        { valor: 'Familiar', etiqueta: 'Familiar', detalle: 'Divorcio, pensión alimenticia, sucesiones y herencias' },
                        { valor: 'Civil', etiqueta: 'Civil', detalle: 'Propiedad, arrendamiento, cobranza, responsabilidad civil' },
                        { valor: 'Otro', etiqueta: 'Otro / No estoy seguro', detalle: 'Explicaré mi situación en los detalles' },
                    ],
                },
                {
                    clave: 'estado',
                    tipo: 'opciones',
                    lista: true,
                    titulo: 'Estado del asunto',
                    texto: '¿En qué fase se encuentra?',
                    ayuda: 'Esto nos ayuda a dimensionar la urgencia y el tipo de atención que necesita.',
                    opciones: [
                        { valor: 'Preventivo', etiqueta: 'Preventivo', detalle: 'Sin conflicto aún' },
                        { valor: 'Extrajudicial', etiqueta: 'Extrajudicial', detalle: 'Conflicto sin demanda' },
                        { valor: 'Judicial', etiqueta: 'Judicial', detalle: 'Demanda en curso' },
                        { valor: 'No sé', etiqueta: 'No lo sé', detalle: 'Necesito orientación' },
                    ],
                },
                {
                    clave: 'urgencia',
                    tipo: 'opciones',
                    lista: true,
                    titulo: 'Estado del asunto',
                    texto: 'Nivel de urgencia',
                    opciones: [
                        { valor: 'Inmediata', etiqueta: '⚡ Inmediata', detalle: 'Plazos corriendo o embargo activo' },
                        { valor: 'Alta', etiqueta: '📅 En semanas', detalle: 'Próximas semanas' },
                        { valor: 'Media', etiqueta: '🕊 Sin prisa', detalle: 'Planeación preventiva' },
                    ],
                },
                {
                    clave: 'descripcion',
                    tipo: 'texto',
                    titulo: 'Cuéntenos su caso',
                    texto: 'Una descripción breve nos permite preparar la evaluación antes de contactarle.',
                    ayuda: 'Resumen de los hechos y su objetivo. Escriba al menos 20 caracteres.',
                    entrada: {
                        placeholder: 'Ej. Tengo un conflicto con mi socio por la distribución de utilidades. Busco recuperar mi participación y disolver la sociedad de forma ordenada.',
                        maxlength: 5000,
                    },
                    validar: (v) => (v.trim().length < 20 ? 'Escriba al menos 20 caracteres.' : null),
                    boton: 'Enviar a socios',
                },
            ],
            alTerminar: (r, api) => {
                const nombre   = r.nombre.trim();
                const telefono = r.telefono.trim();
                const correo   = (r.correo || '').trim() || 'No proporcionado';
                const desc     = r.descripcion.trim();

                let msg = `*EVALUACIÓN ESTRATÉGICA — NUEVO CASO*\n\n`;
                msg += `*1. DATOS DE CONTACTO*\n`;
                msg += `👤 Nombre: ${nombre}\n`;
                msg += `📱 Teléfono: ${telefono}\n`;
                msg += `📧 Correo: ${correo}\n\n`;
                msg += `*2. NATURALEZA DEL ASUNTO*\n`;
                msg += `⚖️ Materia: ${r.materia}\n`;
                msg += `📍 Estado: ${r.estado}\n`;
                msg += `⏱️ Urgencia: ${r.urgencia}\n\n`;
                msg += `*3. DESCRIPCIÓN DEL CASO*\n${desc}\n\n`;
                msg += `_Solicito evaluación por parte de un socio fundador._`;

                // Síncrono dentro del clic: si se abre tras un await, el navegador bloquea la ventana.
                window.open(`https://wa.me/524191239646?text=${encodeURIComponent(msg)}`, '_blank');

                api.final({
                    titulo: 'Protocolo de confidencialidad iniciado',
                    texto: 'Su planteamiento ha sido registrado de forma segura. Se ha enviado una copia a la bandeja directa de nuestros socios fundadores.',
                    contenido: document.getElementById('eval-confirmacion').content.firstElementChild.cloneNode(true),
                    atras: false,
                    botones: [{ texto: 'Volver al inicio', href: 'index.html' }],
                });
            },
        });
    })();
    </script>
    <script src="analytics.js?v=11"></script>
</body>
</html>
